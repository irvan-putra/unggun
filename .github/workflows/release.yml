name: unggun signed release

# Manual only. Builds the release APK, signs it with the unggun key from repository secrets,
# verifies package, version and certificate, then publishes a GitHub pre-release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_CERT_SHA256: "1F7A762C99D357B076968C9BCEFEDF45FF9B65231C60AF2D43A5160783D5BF29"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build and sign
        env:
          KS_B64: ${{ secrets.UNGGUN_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UNGGUN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNGGUN_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UNGGUN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/unggun.jks"
          {
            echo "storeFile=$RUNNER_TEMP/unggun.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          flutter build apk --flavor normal --release
          rm -f android/key.properties "$RUNNER_TEMP/unggun.jks"
      - name: Verify signature, package and version
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK=$(ls build/app/outputs/flutter-apk/app-normal-release.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          test -n "$EXPECTED_CERT_SHA256"
          test "$GOT" = "$EXPECTED_CERT_SHA256"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt | head -3
          grep -q "package: name='com.vanipy.unggun'" /tmp/badging.txt
          grep -q "versionName='${VER}'" /tmp/badging.txt
          cp "$APK" "unggun-v${VER}.apk"
          sha256sum "unggun-v${VER}.apk"   # logged; no sidecar asset - GitHub's digest is the checksum
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          cat > notes.md <<NOTES
          unggun ${VER}: experimental fork of Obtainium 1.7.4 with its own package ID (com.vanipy.unggun) and bonfire icon. Installs next to Obtainium. This update keeps background update checks alive with a real foreground service: while a batch runs (including the automatic rechecks queued after a rate limit), a dataSync foreground service owns the ongoing progress notification and Android treats the check as user-visible work, so it is not killed mid-batch when you leave the app or the screen turns off. The pattern is Mihon's library update; when Android refuses the service start (background-start restrictions on Android 12+), the check falls back to the 0.1.7 notification-only behavior. The launcher icon badge now reads ${VER}. Install over the existing unggun app, do not uninstall or clear storage. Signed with the unggun key (certificate SHA-256 ${EXPECTED_CERT_SHA256}). SHA-256 of the APK is GitHub's asset digest on the release. See NOTICE.md for changes from upstream.
          NOTES
          gh release create "v${VER}" "unggun-v${VER}.apk" \
            --title "unggun ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"
